<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>mjasrar — building a software ecosystem</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg:        #0a0a0b;
    --bg-deep:   #060607;
    --surface:   #111114;
    --surface-2: #15161a;
    --line:      rgba(255,255,255,0.07);
    --line-2:    rgba(255,255,255,0.12);
    --line-3:    rgba(255,255,255,0.18);
    --fg:        #ededed;
    --fg-2:      #c8c8cc;
    --mute:      #82828a;
    --mute-2:    #5a5a62;
    --accent:    oklch(0.86 0.17 138);
    --accent-2:  oklch(0.86 0.17 138 / 0.14);
    --accent-3:  oklch(0.86 0.17 138 / 0.32);
    --danger:    oklch(0.72 0.18 25);
    --warn:      oklch(0.82 0.14 75);
    --info:      oklch(0.78 0.14 240);

    --r-sm: 6px;
    --r-md: 10px;
    --r-lg: 16px;
    --r-xl: 22px;

    --pad-section: 120px;
    --container: 1280px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
  body {
    font-family: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    letter-spacing: -0.005em;
    overflow-x: hidden;
  }

  .mono { font-family: "Geist Mono", ui-monospace, "JetBrains Mono", Menlo, monospace; }

  ::selection { background: var(--accent-3); color: var(--fg); }

  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }

  .container { max-width: var(--container); margin: 0 auto; padding: 0 32px; }

  .bg-grid {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 56px 56px;
    background-position: -1px -1px;
    mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 30%, transparent 75%);
  }
  .bg-glow {
    position: fixed; top: -200px; left: 50%; transform: translateX(-50%);
    width: 1100px; height: 700px; pointer-events: none; z-index: 0;
    background: radial-gradient(closest-side, var(--accent-2), transparent 70%);
    opacity: 0.7;
    filter: blur(20px);
  }

  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    height: 24px; padding: 0 9px;
    border: 1px solid var(--line-2); border-radius: 999px;
    background: rgba(255,255,255,0.02);
    font-family: "Geist Mono", monospace; font-size: 11px; color: var(--fg-2);
    letter-spacing: 0.02em;
  }
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--mute); }
  .chip.live .dot { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-2); }
  .chip.warn .dot { background: var(--warn); }
  .chip.info .dot { background: var(--info); }
  .chip.muted .dot { background: var(--mute-2); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 40px; padding: 0 16px;
    border-radius: var(--r-md);
    border: 1px solid var(--line-2);
    background: rgba(255,255,255,0.03);
    color: var(--fg);
    font-size: 14px; font-weight: 500;
    cursor: pointer;
    transition: background 120ms ease, border-color 120ms ease, transform 120ms ease;
  }
  .btn:hover { background: rgba(255,255,255,0.06); border-color: var(--line-3); }
  .btn:active { transform: translateY(1px); }
  .btn.primary {
    background: var(--fg); color: #0a0a0b; border-color: var(--fg);
  }
  .btn.primary:hover { background: #fff; }
  .btn .arrow { transition: transform 180ms ease; }
  .btn:hover .arrow { transform: translateX(2px); }

  .kbd {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 18px; height: 18px; padding: 0 5px;
    border: 1px solid var(--line-2); border-bottom-width: 2px;
    border-radius: 4px;
    font-family: "Geist Mono", monospace; font-size: 10.5px; color: var(--fg-2);
    background: rgba(255,255,255,0.02);
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
  }
  .panel.hover { transition: border-color 160ms ease, background 160ms ease, transform 160ms ease; }
  .panel.hover:hover { border-color: var(--line-2); background: var(--surface-2); }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: "Geist Mono", monospace;
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--mute);
  }
  .eyebrow::before {
    content: ""; width: 24px; height: 1px; background: var(--line-3);
  }

  h1, h2, h3, h4 { margin: 0; letter-spacing: -0.02em; font-weight: 500; }
  h1 { font-size: clamp(48px, 6.4vw, 92px); line-height: 1.02; letter-spacing: -0.035em; font-weight: 500; }
  h2 { font-size: clamp(32px, 3.6vw, 48px); line-height: 1.08; letter-spacing: -0.028em; }
  h3 { font-size: 20px; line-height: 1.25; }
  p  { margin: 0; color: var(--fg-2); }

  .section { position: relative; padding: var(--pad-section) 0; z-index: 1; }
  .section-head { display: flex; flex-direction: column; gap: 18px; margin-bottom: 56px; max-width: 760px; }
  .section-head .lead { font-size: 17px; color: var(--mute); }

  body[data-density="compact"] { --pad-section: 84px; }
  body[data-density="comfy"]   { --pad-section: 160px; }

  .twk-panel { color: #0a0a0b; }

  .reveal { opacity: 0; transform: translateY(14px); transition: opacity 700ms ease, transform 700ms cubic-bezier(.2,.7,.2,1); }
  .reveal.in { opacity: 1; transform: none; }

  @media (max-width: 880px) {
    :root { --pad-section: 80px; }
    .container { padding: 0 20px; }
  }
</style>
</head>

  <!-- tweaks-panel -->
  <script type="text/babel">
const __TWEAKS_STYLE = `
  .twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:280px;
    max-height:calc(100vh - 32px);display:flex;flex-direction:column;

    font:11.5px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}
  .twk-hd{display:flex;align-items:center;justify-content:space-between;
    padding:10px 8px 10px 14px;cursor:move;user-select:none}
  .twk-hd b{font-size:12px;font-weight:600;letter-spacing:.01em}
  .twk-x{appearance:none;border:0;background:transparent;color:rgba(41,38,27,.55);

  .twk-x:hover{background:rgba(0,0,0,.06);color:#29261b}
  .twk-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;
    overflow-y:auto;overflow-x:hidden;min-height:0;
    scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.15) transparent}
  .twk-row{display:flex;flex-direction:column;gap:5px}
  .twk-row-h{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
  .twk-lbl{display:flex;justify-content:space-between;align-items:baseline;color:rgba(41,38,27,.72)}
  .twk-lbl>span:first-child{font-weight:500}
  .twk-val{color:rgba(41,38,27,.5);font-variant-numeric:tabular-nums}
  .twk-sect{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:rgba(41,38,27,.45);padding:10px 0 0}
  .twk-sect:first-child{padding-top:0}
  .twk-field{appearance:none;box-sizing:border-box;width:100%;min-width:0;height:26px;padding:0 8px;
    border:.5px solid rgba(0,0,0,.1);border-radius:7px;
    background:rgba(255,255,255,.6);color:inherit;font:inherit;outline:none}
  .twk-field:focus{border-color:rgba(0,0,0,.25);background:rgba(255,255,255,.85)}
  select.twk-field{padding-right:22px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='rgba(0,0,0,.5)' d='M0 0h10L5 6z'/></svg>");
    background-repeat:no-repeat;background-position:right 8px center}
  .twk-slider{appearance:none;-webkit-appearance:none;width:100%;height:4px;margin:6px 0;
    border-radius:999px;background:rgba(0,0,0,.12);outline:none}
  .twk-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;

  .twk-seg{position:relative;display:flex;padding:2px;border-radius:8px;background:rgba(0,0,0,.06);user-select:none}
  .twk-seg-thumb{position:absolute;top:2px;bottom:2px;border-radius:6px;
    background:rgba(255,255,255,.9);box-shadow:0 1px 2px rgba(0,0,0,.12);
    transition:left .15s cubic-bezier(.3,.7,.4,1),width .15s}
  .twk-seg button{appearance:none;position:relative;z-index:1;flex:1;border:0;
    background:transparent;color:inherit;font:inherit;font-weight:500;min-height:22px;
    border-radius:6px;cursor:default;padding:4px 6px;line-height:1.2}
  .twk-toggle{position:relative;width:32px;height:18px;border:0;border-radius:999px;
    background:rgba(0,0,0,.15);transition:background .15s;cursor:default;padding:0}
  .twk-toggle[data-on="1"]{background:#34c759}
  .twk-toggle i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
    background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
  .twk-toggle[data-on="1"] i{transform:translateX(14px)}
  .twk-chips{display:flex;gap:6px}
  .twk-chip{position:relative;appearance:none;flex:1;min-width:0;height:46px;
    padding:0;border:0;border-radius:6px;overflow:hidden;cursor:default;
    box-shadow:0 0 0 .5px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.06);
    transition:transform .12s,box-shadow .12s}
  .twk-chip:hover{transform:translateY(-1px);box-shadow:0 0 0 .5px rgba(0,0,0,.18),0 4px 10px rgba(0,0,0,.12)}
  .twk-chip[data-on="1"]{box-shadow:0 0 0 1.5px rgba(0,0,0,.85),0 2px 6px rgba(0,0,0,.15)}
  .twk-chip svg{position:absolute;top:6px;left:6px;width:13px;height:13px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = { x: startRight - (ev.clientX - sx), y: startBottom - (ev.clientY - sy) };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" onMouseDown={(e) => e.stopPropagation()} onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSection({ label, children }) {
  return (<><div className="twk-sect">{label}</div>{children}</>);
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const valueRef = React.useRef(value);
  valueRef.current = value;
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    return <TweakSelect label={label} value={value} options={options} onChange={onChange} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;
  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const i = Math.floor(((clientX - r.left - 2) / (r.width - 4)) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };
  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => { if (trackRef.current) { const v = segAt(ev.clientX); if (v !== valueRef.current) onChange(v); } };
    const up = () => { setDragging(false); window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`, width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>{o.label}</button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" value={value} onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero] = colors;
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    data-on={on ? '1' : '0'} style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {on && <svg viewBox="0 0 14 14"><path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" stroke="#fff" /></svg>}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect, TweakColor,
});
  </script>

  <script type="text/babel">
const SAMPLE_TEXT = `mjasrar is an indie-built software platform that bundles small utility tools into one cohesive product surface. Each tool has the same shape: input on the left, output on the right, with optional AI enhancement that runs as a quiet layer underneath. The goal is to build a real software ecosystem one module at a time — not a portfolio, not a side project, but a serious tools platform that grows every week.`;
const SAMPLE_JSON = `{"product":"mjasrar","modules":[{"id":"pdf","status":"shipped"},{"id":"ai","status":"building"}],"version":"0.4.2","privacy":"local-first"}`;

const OPS = [
  { id: 'clean',     label: 'Clean text',          ai: false, kind: 'text' },
  { id: 'format',    label: 'Format JSON',          ai: false, kind: 'json' },
  { id: 'base64',    label: 'Base64',               ai: false, kind: 'text' },
  { id: 'wc',        label: 'Word count',           ai: false, kind: 'text' },
  { id: 'summarize', label: 'Summarize',            ai: true,  kind: 'text' },
  { id: 'rewrite',   label: 'Rewrite — concise',    ai: true,  kind: 'text' },
  { id: 'translate', label: 'Translate → FR',       ai: true,  kind: 'text' },
];

function runOp(opId, input) {
  switch (opId) {
    case 'clean': return input.replace(/[ \t]+/g, ' ').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
    case 'format': try { return JSON.stringify(JSON.parse(input), null, 2); } catch (e) { return '// invalid JSON — ' + (e.message || 'parse error') + '\n' + input; }
    case 'base64': try { return btoa(unescape(encodeURIComponent(input))); } catch (e) { return '// could not encode'; }
    case 'wc': {
      const words = (input.trim().match(/\S+/g) || []).length;
      const chars = input.length, lines = input.split('\n').length, sentences = (input.match(/[.!?]+/g) || []).length;
      return `words ........... ${words}\ncharacters ...... ${chars}\nlines ........... ${lines}\nsentences ....... ${sentences}\nread time ....... ~${Math.max(1, Math.round(words / 220))} min`;
    }
    case 'summarize': return `→ mjasrar bundles small utility tools into one product surface\n→ Each tool: input · process · output. AI is an optional quiet layer\n→ Goal: build a real platform incrementally, weekly releases\n\n— summary generated locally · ai-haiku-4-5 · 312ms`;
    case 'rewrite': return `mjasrar is one product surface for many small tools. Same shape every time: input, output, optional AI underneath. The plan is a real platform — built weekly, module by module.`;
    case 'translate': return `mjasrar est une plateforme logicielle développée en solo qui regroupe de petits outils utilitaires au sein d'une même surface produit cohérente. Chaque outil a la même structure : entrée à gauche, sortie à droite, avec une couche d'IA optionnelle. L'objectif est de construire un véritable écosystème logiciel, module par module.`;
    default: return input;
  }
}

function LiveTool() {
  const [opId, setOpId] = React.useState('summarize');
  const op = OPS.find((o) => o.id === opId);
  const [input, setInput] = React.useState(SAMPLE_TEXT);
  const [output, setOutput] = React.useState('');
  const [running, setRunning] = React.useState(false);
  const [aiToggle, setAiToggle] = React.useState(true);

  React.useEffect(() => {
    if (op.kind === 'json' && !input.trim().startsWith('{')) setInput(SAMPLE_JSON);
    if (op.kind === 'text' && input.trim().startsWith('{') && input.length < 200) setInput(SAMPLE_TEXT);
  }, [opId]);

  React.useEffect(() => {
    setRunning(true);
    const delay = op.ai && aiToggle ? 520 : 120;
    const t = setTimeout(() => {
      setOutput(op.ai && !aiToggle ? '// AI mode disabled — toggle on to enable ' + op.label.toLowerCase() + '.' : runOp(op.id, input));
      setRunning(false);
    }, delay);
    return () => clearTimeout(t);
  }, [input, opId, aiToggle]);

  const tb = { height: 28, padding: '0 10px', fontSize: 12, borderRadius: 7, cursor: 'default', display: 'inline-flex', alignItems: 'center', gap: 6, fontFamily: '"Geist Mono", monospace' };

  return (

      <div style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '12px 16px', borderBottom: '1px solid var(--line)', background: 'rgba(255,255,255,0.015)' }}>
        <span style={{ width: 22, height: 22, borderRadius: 6, background: 'linear-gradient(135deg, var(--accent), oklch(0.7 0.18 165))', color: '#0a0a0b', fontFamily: '"Geist Mono", monospace', fontWeight: 700, fontSize: 11, display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}>m</span>
        <div style={{ fontFamily: '"Geist Mono", monospace', fontSize: 12, color: 'var(--mute)', display: 'flex', alignItems: 'center', gap: 8 }}>
          <span style={{ color: 'var(--fg)' }}>Workbench</span>
          <span style={{ color: 'var(--mute-2)' }}>/</span>
          <span>{op.label}</span>
        </div>
        <div style={{ flex: 1 }} />
        <button onClick={() => setAiToggle(!aiToggle)}
          style={{ ...tb, border: '1px solid ' + (aiToggle ? 'var(--accent-3)' : 'var(--line)'), background: aiToggle ? 'var(--accent-2)' : 'transparent', color: aiToggle ? 'var(--accent)' : 'var(--fg-2)' }}>
          <Ico.spark /> AI {aiToggle ? 'on' : 'off'}
        </button>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', minHeight: 360 }} className="lt-cols">
        <div style={{ padding: 18, display: 'flex', flexDirection: 'column', gap: 10, borderRight: '1px solid var(--line)' }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, fontFamily: '"Geist Mono", monospace', fontSize: 11, color: 'var(--mute)', letterSpacing: '0.06em', textTransform: 'uppercase' }}>
              <span>Input</span>
              <span style={{ color: 'var(--mute-2)' }}>{input.length} chars</span>
            </div>
            <div style={{ display: 'flex', gap: 6 }}>
              <button className="btn" style={{ height: 26, padding: '0 8px', fontSize: 11.5 }} onClick={() => setInput(op.kind === 'json' ? SAMPLE_JSON : SAMPLE_TEXT)}>Reset</button>
              <button className="btn" style={{ height: 26, padding: '0 8px', fontSize: 11.5 }} onClick={() => setInput('')}>Clear</button>
            </div>
          </div>
          <textarea style={{ flex: 1, minHeight: 260, background: 'rgba(0,0,0,0.25)', border: '1px solid var(--line)', borderRadius: 10, padding: 14, color: 'var(--fg)', fontFamily: '"Geist Mono", monospace', fontSize: 12.5, lineHeight: 1.6, resize: 'none', outline: 0 }}
            value={input} onChange={(e) => setInput(e.target.value)} spellCheck={false} />
        </div>

        <div style={{ padding: 18, display: 'flex', flexDirection: 'column', gap: 10 }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, fontFamily: '"Geist Mono", monospace', fontSize: 11, color: 'var(--mute)', letterSpacing: '0.06em', textTransform: 'uppercase' }}>
              <span>Output</span>
              {op.ai && aiToggle && <span className="chip mono" style={{ height: 18, padding: '0 6px', fontSize: 10, background: 'var(--accent-2)', color: 'var(--accent)', borderColor: 'transparent' }}>AI</span>}
              {running && <span className="mono" style={{ color: 'var(--accent)' }}>● running</span>}
            </div>
            <div style={{ display: 'flex', gap: 6 }}>
              <button className="btn" style={{ height: 26, padding: '0 8px', fontSize: 11.5 }} onClick={() => navigator.clipboard?.writeText(output)}><Ico.clip /> Copy</button>

            </div>
          </div>
          <div style={{ flex: 1, minHeight: 260, background: 'rgba(0,0,0,0.25)', border: '1px solid var(--line)', borderRadius: 10, padding: 14, color: 'var(--fg)', fontFamily: '"Geist Mono", monospace', fontSize: 12.5, lineHeight: 1.6, whiteSpace: 'pre-wrap', overflow: 'auto' }}>{output || ' '}</div>
        </div>
      </div>

      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, padding: '12px 18px', borderTop: '1px solid var(--line)', background: 'rgba(255,255,255,0.012)' }}>

            {o.ai && <Ico.spark />}{o.label}

      </div>

      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '10px 16px', borderTop: '1px solid var(--line)', fontFamily: '"Geist Mono", monospace', fontSize: 11, color: 'var(--mute)' }}>

        <span>{op.ai ? 'haiku-4-5 · on-device routing' : 'wasm · 4kb runtime'}</span>
      </div>
      <style>{`@media(max-width:880px){.lt-cols{grid-template-columns:1fr!important}.lt-cols>div:first-child{border-right:0!important;border-bottom:1px solid var(--line)}}`}</style>
    </div>
  );
}

  <!-- app -->
  <script type="text/babel">
const ACCENT_OPTIONS = {
  phosphor: { primary: 'oklch(0.86 0.17 138)', label: 'Phosphor lime' },
  amber:    { primary: 'oklch(0.82 0.16 75)',  label: 'Solar amber'   },
  iris:     { primary: 'oklch(0.78 0.16 285)', label: 'Iris violet'   },
  ember:    { primary: 'oklch(0.74 0.18 25)',  label: 'Ember red'     },
};

function App() {
  const [t, setTweak] = useTweaks(window.TWEAK_DEFAULTS);

  React.useEffect(() => {
    const a = ACCENT_OPTIONS[t.accent] || ACCENT_OPTIONS.phosphor;
    const root = document.documentElement;
    root.style.setProperty('--accent', a.primary);
    // oklch(L C H) → oklch(L C H / alpha)
    const toAlpha = (c, a) => c.replace(/\)$/, ` / ${a})`);
    root.style.setProperty('--accent-2', toAlpha(a.primary, '0.14'));
    root.style.setProperty('--accent-3', toAlpha(a.primary, '0.32'));
  }, [t.accent]);

  React.useEffect(() => { document.body.setAttribute('data-density', t.density); }, [t.density]);

  React.useEffect(() => {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold: 0.1, rootMargin: '0px 0px -8% 0px' });
    document.querySelectorAll('.reveal').forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, []);

  return (
    <>
      <Nav />
      <Hero heroLineIdx={t.heroLine} />
      <ToolsSection />
      {t.showLiveTool && <LiveToolSection />}
      <AILayer />
      <Ecosystem />
      <Projects />
      <FinalCTA />
      <Footer />

      <TweaksPanel title="Tweaks">
        <TweakSection label="Brand" />
        <TweakColor
          label="Accent"
          value={ACCENT_OPTIONS[t.accent]?.primary || ACCENT_OPTIONS.phosphor.primary}
          options={Object.values(ACCENT_OPTIONS).map((a) => a.primary)}
          onChange={(v) => {
            const key = Object.keys(ACCENT_OPTIONS).find(k => ACCENT_OPTIONS[k].primary === v);
            if (key) setTweak('accent', key);
          }}
        />
        <TweakSection label="Hero" />
        <TweakSelect
          label="Positioning line"
          value={String(t.heroLine)}
          options={[
            { value: '0', label: 'Building systems' },
            { value: '1', label: 'A growing ecosystem' },
            { value: '2', label: 'AI-enhanced tooling' },
          ]}
          onChange={(v) => setTweak('heroLine', Number(v))}
        />
        <TweakSection label="Layout" />
        <TweakRadio
          label="Density"
          value={t.density}
          options={['compact', 'regular', 'comfy']}
          onChange={(v) => setTweak('density', v)}
        />
        <TweakToggle
          label="Live workbench"
          value={t.showLiveTool}
          onChange={(v) => setTweak('showLiveTool', v)}
        />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

</body>
